name: release

permissions:
  contents: write
  id-token: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: |
          Next release version. Possible values: x.y.z, major, minor, patch or pre|rc|etc.
          Also, you can pass 'skip' to skip 'git tag' and do 'gem push' for the current version
        required: true
        default: 'skip'
  push:
    tags: [ v* ]

# Publishing uses OIDC Trusted Publishing (ali pattern): the trusted
# publisher registered on rubygems.org is this repository calling the
# reusable workflow rubygems-release.yml from metanorma/ci. The
# LUTAML_CI_RUBYGEMS_API_KEY secret is intentionally not set, which makes
# the workflow take the trusted-publishing path instead of API-key auth.
jobs:
  release:
    uses: metanorma/ci/.github/workflows/rubygems-release.yml@main
    with:
      next_version: ${{ github.event.inputs.next_version }}
    secrets:
      rubygems-api-key: ${{ secrets.LUTAML_CI_RUBYGEMS_API_KEY }}
