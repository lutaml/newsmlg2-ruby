name: rake

permissions:
  contents: write
  packages: write

on:
  push:
    branches: [ master, main ]
    tags: [ v* ]
  pull_request:
  workflow_dispatch:

# pat_token is intentionally not forwarded (ali pattern): the org
# LUTAML_CI_PAT_TOKEN does not cover this repository, and the
# tests-passed dispatch only notifies this same repo, for which the
# workflow's default GITHUB_TOKEN is sufficient.
jobs:
  rake:
    uses: metanorma/ci/.github/workflows/generic-rake.yml@main
